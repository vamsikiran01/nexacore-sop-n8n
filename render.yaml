services:
  - type: web
    name: nexacore-sop-agent
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: N8N_PORT
        value: "10000"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: N8N_LISTEN_ADDRESS
        value: "0.0.0.0"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: WEBHOOK_URL
        value: "https://nexacore-sop-agent.onrender.com/"
      - key: N8N_EDITOR_BASE_URL
        value: "https://nexacore-sop-agent.onrender.com/"
      - key: N8N_ENCRYPTION_KEY
        value: "nexacore-vamsi-secret-key-2026"
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: "postgres"
      - key: DB_POSTGRESDB_SCHEMA
        value: "n8n"
      - key: DB_POSTGRESDB_HOST
        value: "aws-0-ap-northeast-1.pooler.supabase.com"
      - key: DB_POSTGRESDB_USER
        value: "postgres.raxhedpctwvcwimkajyv"
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
